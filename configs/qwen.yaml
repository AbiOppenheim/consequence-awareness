# Fixed configuration for the primary model. One variable per experiment: change a
# value here (or override on the CLI), never edit two knobs in the same run.
# Every direction extracted under this config inherits these fields into its sidecar .json.

model:
  id: Qwen/Qwen2.5-7B-Instruct
  d_model: 3584
  n_layers: 28          # decoder blocks; hidden_states has n_layers + 1 entries (embeds + each block)
  dtype: bfloat16

seed: 0                  # fixed everywhere; recorded in every sidecar

# ---- Stage 01: activation caching (GPU) ----
acts:
  token_position: -1     # last prompt token; the residual-stream accumulator
  # We cache ALL layers in one forward pass (output_hidden_states=True) and slice later on CPU.
  batch_size: 16

# ---- Stage 02/03: extraction + probes (CPU) ----
extract:
  # Layers to sweep when picking where v_C lives. Mid-stack for a 28-layer model.
  layer_sweep: [8, 10, 12, 14, 16, 18, 20, 22, 24]

# ---- Stage 05: steering / knockout (GPU) ----
steer:
  # Activation-addition window: h <- h + alpha * v_C  (toward "real").
  layers: [12, 14, 16]
  # alpha multiplies the UNIT direction. Because residual-stream norms are large, these are
  # placeholders to be tuned against measured norms in the first sweep, not final values.
  alphas: [0, 2, 4, 8, 16]

knockout:
  # Projection knockout window for the distinctness test. Zhong's persona knockout lives late.
  layers: [20, 21, 22]

# ---- Stage 05: generation (GPU) ----
generate:
  max_new_tokens: 256
  batch_size: 16
  do_sample: false       # greedy; deterministic given the seed

# ---- Stage 06: judging (API, CPU) ----
judge:
  provider: anthropic
  model: claude-haiku-4-5-20251001   # Haiku-class bulk judge
  use_batch_api: true
  # Never report StrongREJECT alone; always emit the three-way refusal/bypass/degenerate label.

paths:
  activations: artifacts/activations
  directions: artifacts/directions
  generations: artifacts/generations
  scores: artifacts/scores
  figures: artifacts/figures
  # One small JSON per analysis step, keyed on a hash of its inputs + code (consequence.results).
  # These are the numbers that go into the write-up, and they are committed.
  results: artifacts/results

data:
  consequence: data/contrast/consequence.jsonl
  refusal: data/contrast/refusal.jsonl
  persona: data/contrast/persona.jsonl        # v_MP, instruction in SYSTEM prompt (Zhong's convention)
  persona_ut: data/contrast/persona_ut.jsonl  # v_MP, instruction in USER turn (matches v_C/r_hat extraction)
  fiction_jailbreaks: data/eval/fiction_jailbreaks.jsonl
  xstest: data/eval/xstest.jsonl
